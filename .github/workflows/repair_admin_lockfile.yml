name: Repair Admin Lockfile

on:
  push:
    branches:
      - fix/admin-deploy-lockfile-20261010

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/admin-deploy-lockfile-20261010

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only

      - name: Verify clean npm ci
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock.json changes required."
          else
            git commit -m "fix: synchronize admin dependency lockfile"
            git push origin HEAD:fix/admin-deploy-lockfile-20261010
          fi
