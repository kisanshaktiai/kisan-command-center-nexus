name: NDVI Pipeline

on:
  schedule:
    - cron: "0 2 * * *"     # daily 2 AM UTC
  workflow_dispatch: {}

jobs:
  fetch-ndvi:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install -r ndvi-harvest-worker/requirements.txt

    - name: Run NDVI worker
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        INGESTOR_EMAIL: ${{ secrets.INGESTOR_EMAIL }}
        INGESTOR_PASSWORD: ${{ secrets.INGESTOR_PASSWORD }}
        STORAGE_BUCKET: satellite-tiles
        SUPABASE_COUNTRY_CODE: IND
        CLOUD_COVER_THRESHOLD: 20
      run: python ndvi-harvest-worker/ndvi_worker.py
