name: Deploy Admin (Hostinger)

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node setup
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # --------------------------------------------------
      # Install + Build
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # --------------------------------------------------
      # Generate build hash
      # --------------------------------------------------
      - name: Generate build hash
        id: build
        run: |
          echo "build_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 🔢 Compute NEXT semantic version (AUTO INCREMENT)
      # --------------------------------------------------
      - name: Compute next version
        id: next_version
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_KEY: admin_portal
        run: |
          LAST_VERSION=$(curl -s \
            "$SUPABASE_URL/rest/v1/app_versions?app_key=eq.$APP_KEY&select=version&order=created_at.desc&limit=1" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            | jq -r '.[0].version // "1.0.0"')

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          PATCH=$((PATCH + 1))
          NEXT_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 🚀 Deploy to Hostinger (NO dist folder)
      # --------------------------------------------------
      - name: Deploy Admin via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ADMIN_SSH_HOST }}
          username: ${{ secrets.ADMIN_SSH_USER }}
          key: ${{ secrets.ADMIN_SSH_KEY }}
          port: ${{ secrets.ADMIN_SSH_PORT }}

          source: "dist/*"
          target: ${{ secrets.ADMIN_REMOTE_DIR }}

          strip_components: 1
          overwrite: true

      # --------------------------------------------------
      # 🧾 Register version in Supabase (UPSERT)
      # --------------------------------------------------
      - name: Register version in Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_KEY: admin_portal
          VERSION: ${{ steps.next_version.outputs.version }}
          BUILD_HASH: ${{ steps.build.outputs.build_hash }}
        run: |
          curl -X POST "$SUPABASE_URL/rest/v1/app_versions?on_conflict=build_hash" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d '{
              "app_key": "'"$APP_KEY"'",
              "version": "'"$VERSION"'",
              "build_hash": "'"$BUILD_HASH"'",
              "deployed_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'",
              "metadata": {
                "repo": "'"$GITHUB_REPOSITORY"'",
                "commit": "'"$GITHUB_SHA"'",
                "workflow": "'"$GITHUB_WORKFLOW"'",
                "run_id": "'"$GITHUB_RUN_ID"'"
              }
            }'

      # --------------------------------------------------
      # ⭐ Mark this version as CURRENT (trigger-safe)
      # --------------------------------------------------
      - name: Mark version as current
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BUILD_HASH: ${{ steps.build.outputs.build_hash }}
        run: |
          curl -X PATCH "$SUPABASE_URL/rest/v1/app_versions?build_hash=eq.$BUILD_HASH" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{ "is_current": true }'

      # --------------------------------------------------
      # Success message
      # --------------------------------------------------
      - name: Deployment success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Admin panel deployed successfully"
          echo "📦 Version: ${{ steps.next_version.outputs.version }}"
          echo "🔖 Build:   ${{ steps.build.outputs.build_hash }}"
          echo "🌍 URL: https://admin.kisanshakti.in"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
