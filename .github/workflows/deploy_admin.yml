name: Deploy Admin (Hostinger)

on:
  push:
    branches: [ main, production ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Node setup
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # --------------------------------------------------
      # Install + Build
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      
      # --------------------------------------------------
      # Generate version info
      # --------------------------------------------------
      - name: Generate app version info
        id: version
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
          echo "build_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # --------------------------------------------------
      # 🚀 DEPLOY TO HOSTINGER (THIS WAS MISSING)
      # --------------------------------------------------
      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ADMIN_SSH_HOST }}
          username: ${{ secrets.ADMIN_SSH_USER }}
          key: ${{ secrets.ADMIN_SSH_KEY }}
          port: ${{ secrets.ADMIN_SSH_PORT }}

          source: "dist/*"
          target: ${{ secrets.ADMIN_REMOTE_DIR }}

          overwrite: true

      # --------------------------------------------------
      # Register version in Supabase (FIXED HEADERS)
      # --------------------------------------------------
      - name: Register version in Supabase
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_HASH: ${{ steps.version.outputs.build_hash }}
        run: |
          curl -X POST "$SUPABASE_URL/rest/v1/app_versions" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "app_key": "'"$APP_KEY"'",
              "version": "'"$VERSION"'",
              "build_hash": "'"$BUILD_HASH"'",
              "is_current": true,
              "deployed_at": "'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"
            }'

      # --------------------------------------------------
      # Success message (REAL now)
      # --------------------------------------------------
      - name: Deployment success
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Admin panel deployed successfully"
          echo "📦 Version: ${{ steps.version.outputs.version }}"
          echo "🔖 Build:   ${{ steps.version.outputs.build_hash }}"
          echo "🌍 URL: https://admin.kisanshakti.in"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
